name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Two pushes close together must not run the launcher's git reset concurrently.
    concurrency:
      group: deploy-tds-hub
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Direct pushes to main skip PR CI, so check again before anything goes live.
      - uses: actions/checkout@v4
      - run: python3 scripts/check_site.py
      - run: python3 -m unittest discover -s tests
      - name: Pin the server's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trigger the deploy launcher on the server
        # The key is restricted server-side to running deploy-launcher.sh, whatever we ask for.
        run: ssh -o BatchMode=yes "ubuntu@${{ secrets.DEPLOY_HOST }}"
