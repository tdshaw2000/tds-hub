name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_site.py
      - run: python3 -m unittest discover -s tests -v
      - name: Compose file is valid
        run: docker compose -f deploy/compose.yaml config -q
