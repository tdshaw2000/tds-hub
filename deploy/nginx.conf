server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Pick up apps.json and skins.json edits straight away.
    location ~ ^/(apps|skins)\.json$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
