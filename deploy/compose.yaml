# tds-hub on the shared OCI VM. A tiny nginx container serving ~/apps/tds-hub/repo/site,
# reached by the edge Caddy stack (scramble-challenge repo, edge/) over its Docker network.
# The site is bind-mounted read-only, so `git pull` in the checkout is a full deploy.
name: tds-hub

services:
  web:
    image: nginx:1-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # No ports: Caddy reaches this as tds-hub:8000 on the edge network.
    networks:
      edge:
        aliases:
          - tds-hub
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-scramble-challenge-edge}
